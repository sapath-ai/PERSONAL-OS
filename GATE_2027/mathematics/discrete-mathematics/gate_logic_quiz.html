<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE CSE — Logic & FOL Practice</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --card: #1a1e2a;
    --border: #252b3b;
    --accent: #4f8ef7;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --orange: #fb923c;
    --text: #e8eaf0;
    --muted: #7a82a0;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --display: 'Playfair Display', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0d0f14 0%, #141228 50%, #0d1420 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 40px 20px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .logo { font-family: var(--display); font-size: 1.6rem; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--accent2); }
  .scoreboard {
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
    font-family: var(--mono); font-size: 0.78rem;
  }
  .score-pill {
    background: var(--card); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 20px;
    display: flex; gap: 6px; align-items: center;
  }
  .score-pill .label { color: var(--muted); }
  .score-pill .val { font-weight: 600; }
  .val.pos { color: var(--green); }
  .val.neg { color: var(--red); }
  .val.neu { color: var(--yellow); }
  .val.total { color: var(--accent); font-size: 0.9rem; }

  /* FILTER BAR */
  .filter-bar {
    padding: 12px 40px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: 0.75rem; font-family: var(--sans); transition: all 0.18s;
  }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-btn.active { font-weight: 600; }
  .progress-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; color: var(--muted); }
  .progress-bar { width: 120px; height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.3s; }

  /* MAIN */
  main { max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; }

  /* QUESTION CARD */
  .q-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 28px; overflow: hidden; transition: border-color 0.2s;
    display: block;
  }
  .q-card.hidden { display: none; }
  .q-card.answered-correct { border-color: var(--green); }
  .q-card.answered-wrong { border-color: var(--red); }
  .q-card.answered-partial { border-color: var(--yellow); }

  .q-header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 20px; background: rgba(255,255,255,0.02);
    border-bottom: 1px solid var(--border);
  }
  .q-num { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); min-width: 28px; }
  .q-type-badge {
    padding: 3px 10px; border-radius: 10px; font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .badge-mcq { background: rgba(79,142,247,0.15); color: var(--accent); border: 1px solid rgba(79,142,247,0.3); }
  .badge-msq { background: rgba(167,139,250,0.15); color: var(--accent2); border: 1px solid rgba(167,139,250,0.3); }
  .badge-nat { background: rgba(251,191,36,0.15); color: var(--yellow); border: 1px solid rgba(251,191,36,0.3); }
  .q-marks {
    padding: 3px 10px; border-radius: 10px; font-size: 0.68rem; font-weight: 600;
    background: rgba(52,211,153,0.1); color: var(--green); border: 1px solid rgba(52,211,153,0.25);
  }
  .q-topic { font-size: 0.7rem; color: var(--muted); margin-left: 2px; }
  .pyq-badge {
    padding: 2px 8px; border-radius: 8px; font-size: 0.65rem; font-weight: 700;
    background: rgba(251,146,60,0.15); color: var(--orange); border: 1px solid rgba(251,146,60,0.3);
  }

  /* TIMER inside card */
  .q-timer-row { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .q-timer {
    font-family: var(--mono); font-size: 0.78rem; color: var(--accent);
    background: rgba(79,142,247,0.1); padding: 4px 10px; border-radius: 8px;
    border: 1px solid rgba(79,142,247,0.2); min-width: 58px; text-align: center;
    cursor: pointer; user-select: none; transition: background 0.15s;
  }
  .q-timer.running { color: var(--yellow); background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); }
  .q-timer.paused { color: var(--muted); }
  .last-time { font-size: 0.65rem; color: var(--muted); font-family: var(--mono); white-space: nowrap; }

  /* BODY */
  .q-body { padding: 20px 20px 14px; }
  .q-text {
    font-size: 0.95rem; line-height: 1.75; color: var(--text); margin-bottom: 18px;
  }
  .q-text code, code {
    font-family: var(--mono); background: rgba(255,255,255,0.06);
    padding: 1px 6px; border-radius: 4px; font-size: 0.88em; color: var(--accent2);
  }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 9px; }
  .opt-label {
    display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
    padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.02); transition: all 0.15s;
    font-size: 0.9rem; line-height: 1.55;
  }
  .opt-label:hover { border-color: rgba(79,142,247,0.4); background: rgba(79,142,247,0.05); }
  .opt-label input { display: none; }
  .opt-marker {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; font-family: var(--mono);
    transition: all 0.15s; margin-top: 1px;
  }
  .badge-msq ~ .q-body .opt-marker, .msq-marker { border-radius: 4px; }
  .opt-label.selected .opt-marker {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .opt-label.correct-ans { border-color: var(--green); background: rgba(52,211,153,0.07); }
  .opt-label.correct-ans .opt-marker { background: var(--green); border-color: var(--green); color: #0d0f14; }
  .opt-label.wrong-ans { border-color: var(--red); background: rgba(248,113,113,0.07); }
  .opt-label.wrong-ans .opt-marker { background: var(--red); border-color: var(--red); color: #fff; }

  /* NAT input */
  .nat-input-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .nat-input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--mono); font-size: 1rem;
    padding: 10px 16px; width: 180px; outline: none; transition: border-color 0.15s;
  }
  .nat-input:focus { border-color: var(--accent); }
  .nat-hint { font-size: 0.75rem; color: var(--muted); }

  /* ACTIONS */
  .q-actions {
    padding: 12px 20px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-top: 1px solid var(--border);
  }
  .btn {
    padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 0.82rem; font-weight: 600; font-family: var(--sans); transition: all 0.16s;
  }
  .btn-submit { background: var(--accent); color: #fff; }
  .btn-submit:hover { background: #3a7de8; }
  .btn-submit:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-clear:hover { border-color: var(--red); color: var(--red); }
  .btn-explain { background: rgba(167,139,250,0.12); border: 1px solid rgba(167,139,250,0.25); color: var(--accent2); }
  .btn-explain:hover { background: rgba(167,139,250,0.22); }
  .result-msg { font-size: 0.82rem; font-weight: 600; margin-left: 4px; }
  .result-msg.correct { color: var(--green); }
  .result-msg.wrong { color: var(--red); }
  .result-msg.partial { color: var(--yellow); }
  .marks-delta { font-size: 0.75rem; font-family: var(--mono); color: var(--muted); margin-left: 2px; }

  /* EXPLANATION */
  .explanation {
    display: none; margin: 0 20px 18px; padding: 14px 16px;
    background: rgba(167,139,250,0.06); border: 1px solid rgba(167,139,250,0.2);
    border-radius: 8px; font-size: 0.87rem; line-height: 1.7; color: #c4cadf;
  }
  .explanation.visible { display: block; }
  .explanation strong { color: var(--accent2); }

  /* SECTION DIVIDER */
  .section-divider {
    display: flex; align-items: center; gap: 14px; margin: 36px 0 20px;
  }
  .section-divider h2 { font-family: var(--display); font-size: 1.2rem; color: var(--text); white-space: nowrap; }
  .section-divider .line { flex: 1; height: 1px; background: var(--border); }
  .section-divider .count { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }

  /* MODAL - Results */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px; max-width: 480px; width: 90%; text-align: center; }
  .modal h2 { font-family: var(--display); font-size: 1.8rem; margin-bottom: 8px; }
  .modal .big-score { font-size: 3rem; font-weight: 700; font-family: var(--mono); color: var(--accent); margin: 16px 0; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; text-align: left; }
  .modal-stat { background: var(--surface); border-radius: 8px; padding: 12px 14px; }
  .modal-stat .ms-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
  .modal-stat .ms-val { font-size: 1.1rem; font-weight: 600; font-family: var(--mono); }
  .btn-modal-close { background: var(--accent); color: #fff; padding: 11px 28px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; margin-top: 8px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Math rendering */
  .math { font-family: var(--mono); font-style: italic; }

  @media (max-width: 600px) {
    header, .filter-bar { padding-left: 16px; padding-right: 16px; }
    main { padding: 20px 12px 60px; }
    .q-actions { gap: 8px; }
    .btn { padding: 7px 13px; font-size: 0.78rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">GATE <span>Logic</span> Practice</div>
    <div class="scoreboard">
      <div class="score-pill"><span class="label">Attempted</span><span class="val neu" id="sc-attempted">0</span></div>
      <div class="score-pill"><span class="label">Correct</span><span class="val pos" id="sc-correct">0</span></div>
      <div class="score-pill"><span class="label">Wrong</span><span class="val neg" id="sc-wrong">0</span></div>
      <div class="score-pill"><span class="label">Score</span><span class="val total" id="sc-score">0.00</span></div>
      <button class="btn btn-submit" style="padding:6px 14px;font-size:0.75rem;" onclick="showResults()">Results</button>
      <button class="btn btn-clear" style="padding:6px 14px;font-size:0.75rem;" onclick="resetAll()">Reset</button>
    </div>
  </div>
</header>

<div class="filter-bar">
  <button class="filter-btn active" onclick="filterQ('all',this)">All (75)</button>
  <button class="filter-btn" onclick="filterQ('prop',this)">Propositional Logic</button>
  <button class="filter-btn" onclick="filterQ('fol',this)">First-Order Logic</button>
  <button class="filter-btn" onclick="filterQ('mcq',this)">MCQ</button>
  <button class="filter-btn" onclick="filterQ('msq',this)">MSQ</button>
  <button class="filter-btn" onclick="filterQ('nat',this)">NAT</button>
  <button class="filter-btn" onclick="filterQ('pyq',this)">PYQ</button>
  <button class="filter-btn" onclick="filterQ('unattempted',this)">Unattempted</button>
  <div class="progress-wrap">
    <span id="prog-label">0 / 75</span>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>

<main id="main-container">
<!-- Questions injected by JS -->
</main>

<div class="overlay" id="results-overlay">
  <div class="modal">
    <h2>Session Results</h2>
    <div class="big-score" id="modal-score">0.00</div>
    <div class="modal-grid">
      <div class="modal-stat"><div class="ms-label">Attempted</div><div class="ms-val" id="m-att">0</div></div>
      <div class="modal-stat"><div class="ms-label">Unattempted</div><div class="ms-val" id="m-unatt">0</div></div>
      <div class="modal-stat"><div class="ms-label">Correct</div><div class="ms-val" style="color:var(--green)" id="m-cor">0</div></div>
      <div class="modal-stat"><div class="ms-label">Wrong</div><div class="ms-val" style="color:var(--red)" id="m-wr">0</div></div>
      <div class="modal-stat"><div class="ms-label">Marks Gained</div><div class="ms-val" style="color:var(--green)" id="m-gain">0</div></div>
      <div class="modal-stat"><div class="ms-label">Marks Lost</div><div class="ms-val" style="color:var(--red)" id="m-lost">0</div></div>
      <div class="modal-stat"><div class="ms-label">Total Time</div><div class="ms-val" id="m-time">0s</div></div>
      <div class="modal-stat"><div class="ms-label">Accuracy</div><div class="ms-val" id="m-acc">0%</div></div>
    </div>
    <button class="btn-modal-close" onclick="document.getElementById('results-overlay').classList.remove('open')">Close</button>
  </div>
</div>

<script>
// ============================================================
// QUESTION BANK (75 questions)
// ============================================================
const QUESTIONS = [
// ─── PROPOSITIONAL LOGIC ────────────────────────────────────
{id:1,topic:'prop',type:'mcq',marks:1,pyq:false,
 text:'Which of the following is a tautology?',
 opts:['p ∧ ¬p','p ∨ ¬p','p → q','p ↔ q'],
 correct:[1],
 explanation:'<strong>p ∨ ¬p</strong> (Law of Excluded Middle) is always TRUE regardless of the truth value of p. It is a classic tautology. p ∧ ¬p is a contradiction, while p→q and p↔q are contingencies.'
},
{id:2,topic:'prop',type:'mcq',marks:1,pyq:false,
 text:'The negation of "If it rains then I carry an umbrella" is:',
 opts:['It does not rain and I carry an umbrella','It rains and I do not carry an umbrella','It does not rain or I carry an umbrella','If it does not rain then I do not carry an umbrella'],
 correct:[1],
 explanation:'¬(p→q) ≡ p ∧ ¬q. The negation of an implication is NOT another implication; it is a conjunction: "It rains AND I do not carry an umbrella."'
},
{id:3,topic:'prop',type:'mcq',marks:2,pyq:true,
 text:'[GATE 2014] Which one of the following is NOT equivalent to p ↔ q?',
 opts:['(p → q) ∧ (q → p)','(¬p ∨ q) ∧ (¬q ∨ p)','(p ∧ q) ∨ (¬p ∧ ¬q)','(p ∧ ¬q) ∨ (¬p ∧ q)'],
 correct:[3],
 explanation:'p↔q means both have the same truth value: either both true OR both false. That is (p∧q)∨(¬p∧¬q). Option D, (p∧¬q)∨(¬p∧q), is the XOR (exclusive or) which is the NEGATION of biconditional.'
},
{id:4,topic:'prop',type:'mcq',marks:1,pyq:false,
 text:'De Morgan\'s Law states ¬(p ∨ q) is equivalent to:',
 opts:['¬p ∨ ¬q','¬p ∧ ¬q','p ∧ q','¬p → q'],
 correct:[1],
 explanation:'De Morgan\'s Laws: ¬(p∨q) ≡ ¬p ∧ ¬q and ¬(p∧q) ≡ ¬p ∨ ¬q. Negation distributes and flips the connective.'
},
{id:5,topic:'prop',type:'mcq',marks:2,pyq:false,
 text:'Which of the following is a contradiction?',
 opts:['p ∨ (p → q)','(p → q) → p','p ∧ (p → q) ∧ ¬q','¬(p → q) → ¬p'],
 correct:[2],
 explanation:'p ∧ (p→q) ∧ ¬q: if p is true and p→q is true, then q must be true, but ¬q is also asserted. This is unsatisfiable. By Modus Ponens, p and p→q together force q=true, contradicting ¬q.'
},
{id:6,topic:'prop',type:'mcq',marks:1,pyq:true,
 text:'[GATE 2015] The statement "p IMPLIES q" is FALSE only when:',
 opts:['p is false and q is false','p is true and q is true','p is false and q is true','p is true and q is false'],
 correct:[3],
 explanation:'p → q is FALSE only when the antecedent p is TRUE and the consequent q is FALSE. In all other cases the implication holds (vacuously true when p is false).'
},
{id:7,topic:'prop',type:'msq',marks:2,pyq:false,
 text:'Which of the following formulas are logically equivalent to p → q? (Select ALL that apply)',
 opts:['¬p ∨ q','¬q → ¬p','¬(p ∧ ¬q)','p ∨ ¬q'],
 correct:[0,1,2],
 explanation:'<strong>A, B, C are correct.</strong> p→q ≡ ¬p∨q (def of implication). ¬q→¬p is the contrapositive (always equivalent). ¬(p∧¬q) ≡ ¬p∨q by De Morgan. Option D (p∨¬q) is equivalent to q→p (the CONVERSE), not p→q.'
},
{id:8,topic:'prop',type:'mcq',marks:1,pyq:false,
 text:'The Principal Disjunctive Normal Form (PDNF) of p ∧ q for variables {p, q} is:',
 opts:['m₀ (minterm 00)','m₃ (minterm 11)','m₁ ∨ m₂','m₀ ∨ m₁ ∨ m₂'],
 correct:[1],
 explanation:'p ∧ q is TRUE only when p=T, q=T, which corresponds to minterm m₃ (binary 11). PDNF is the disjunction of minterms where the function is 1.'
},
{id:9,topic:'prop',type:'mcq',marks:2,pyq:true,
 text:'[GATE 2016] Consider the following two statements: S1: (P ∧ Q) → R, S2: (P → R) ∧ (Q → R). Which is correct?',
 opts:['S1 implies S2 but not vice versa','S2 implies S1 but not vice versa','S1 and S2 are logically equivalent','Neither implies the other'],
 correct:[1],
 explanation:'S2→S1: If (P→R) and (Q→R), assume P∧Q is true, then P is true, so R is true, so S1 holds. But S1→S2 fails: if P=T,Q=F,R=F then S1: (T∧F)→F = F→F = T, but S2: (T→F)∧(F→F) = F∧T = F. So S2 implies S1 but not vice versa.'
},
{id:10,topic:'prop',type:'nat',marks:1,pyq:false,
 text:'How many rows does the truth table of a formula with 4 propositional variables have?',
 correct_val:16, tolerance:0,
 explanation:'With n variables, the truth table has 2ⁿ rows. For n=4: 2⁴ = 16 rows.'
},
{id:11,topic:'prop',type:'mcq',marks:1,pyq:false,
 text:'Which inference rule is applied here: From "p → q" and "q → r", conclude "p → r"?',
 opts:['Modus Ponens','Modus Tollens','Hypothetical Syllogism','Resolution'],
 correct:[2],
 explanation:'<strong>Hypothetical Syllogism</strong>: from (p→q) and (q→r), infer (p→r). It chains implications transitively. Modus Ponens uses p and p→q to conclude q. Modus Tollens uses ¬q and p→q to conclude ¬p.'
},
{id:12,topic:'prop',type:'mcq',marks:2,pyq:false,
 text:'The formula (p → q) ∧ (q → p) is equivalent to which connective between p and q?',
 opts:['p ∧ q','p ∨ q','p ↔ q','p ⊕ q (XOR)'],
 correct:[2],
 explanation:'(p→q)∧(q→p) is the biconditional p↔q. The biconditional is defined as mutual implication: p→q AND q→p. It is TRUE when p and q have the same truth value.'
},
{id:13,topic:'prop',type:'mcq',marks:1,pyq:false,
 text:'Which of the following is an absorption law?',
 opts:['p ∧ (p ∨ q) ≡ p','p ∨ (p ∧ q) ≡ p ∧ q','p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)','p ∨ (q ∧ r) ≡ p ∨ q'],
 correct:[0],
 explanation:'<strong>Absorption Laws</strong>: p ∧ (p ∨ q) ≡ p, and p ∨ (p ∧ q) ≡ p. Option A is correct. Option C is the distributive law. Option B incorrectly transforms p∨(p∧q).'
},
{id:14,topic:'prop',type:'msq',marks:2,pyq:false,
 text:'Which of the following are tautologies? (Select ALL that apply)',
 opts:['p → (q → p)','(p → (p → q)) → (p → q)','(p ∧ q) → p','p → (p ∨ q)'],
 correct:[0,1,2,3],
 explanation:'All four are tautologies. A: p→(q→p) — if p is true, any q→p holds. B: Law of Self-Distribution. C: Simplification — conjunction implies each conjunct. D: Addition — p implies any disjunction containing p.'
},
{id:15,topic:'prop',type:'mcq',marks:2,pyq:true,
 text:'[GATE 2019] Which of the following is the correct translation of "Every student who does not study hard fails"?',
 opts:['∀x (Student(x) ∧ ¬StudyHard(x) → Fail(x))','∀x (Student(x) → ¬StudyHard(x) → Fail(x))','∃x (Student(x) ∧ ¬StudyHard(x) ∧ Fail(x))','∀x (¬StudyHard(x) → Student(x) ∧ Fail(x))'],
 correct:[0],
 explanation:'The pattern "Every X that is Y does Z" translates as ∀x (X(x) ∧ Y(x) → Z(x)). Here: for every x, if x is a student AND x does not study hard, then x fails.'
},

// ============================================================
// STATE
// ============================================================
const STATE = {
  score: 0, correct: 0, wrong: 0, attempted: 0,
  gained: 0, lost: 0,
  answers: {}, // qid -> {result, delta}
  timers: {}, // qid -> {elapsed, interval, running}
  timeLogs: {} // qid -> last elapsed (persisted)
};

// Load persisted time logs
try {
  const saved = JSON.parse(localStorage.getItem('gate_logic_timelogs') || '{}');
  Object.assign(STATE.timeLogs, saved);
} catch(e) {}

function saveTimeLogs() {
  try { localStorage.setItem('gate_logic_timelogs', JSON.stringify(STATE.timeLogs)); } catch(e) {}
}

// ============================================================
// RENDERING
// ============================================================
function renderAll() {
  const container = document.getElementById('main-container');
  container.innerHTML = '';

  // Section headers
  const propQs = QUESTIONS.filter(q => q.topic === 'prop');
  const folQs = QUESTIONS.filter(q => q.topic === 'fol');

  const propDiv = document.createElement('div');
  propDiv.innerHTML = `<div class="section-divider"><div class="line"></div><h2>Propositional Logic</h2><div class="line"></div><span class="count">${propQs.length} questions</span></div>`;
  container.appendChild(propDiv);
  propQs.forEach(q => container.appendChild(buildCard(q)));

  const folDiv = document.createElement('div');
  folDiv.innerHTML = `<div class="section-divider"><div class="line"></div><h2>First-Order Logic</h2><div class="line"></div><span class="count">${folQs.length} questions</span></div>`;
  container.appendChild(folDiv);
  folQs.forEach(q => container.appendChild(buildCard(q)));
}

function buildCard(q) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `card-${q.id}`;
  card.dataset.topic = q.topic;
  card.dataset.type = q.type;
  card.dataset.pyq = q.pyq ? 'true' : 'false';
  card.dataset.answered = 'false';

  const typeBadge = {mcq:'MCQ',msq:'MSQ',nat:'NAT'}[q.type];
  const typeCls = {mcq:'badge-mcq',msq:'badge-msq',nat:'badge-nat'}[q.type];
  const topicLabel = q.topic === 'prop' ? 'Propositional Logic' : 'First-Order Logic';
  const prevTime = STATE.timeLogs[q.id];
  const prevTimeStr = prevTime != null ? `Last: ${fmtTime(prevTime)}` : '';

  card.innerHTML = `
  <div class="q-header">
    <span class="q-num">Q${q.id}</span>
    <span class="q-type-badge ${typeCls}">${typeBadge}</span>
    <span class="q-marks">${q.marks}M</span>
    <span class="q-topic">${topicLabel}</span>
    ${q.pyq ? '<span class="pyq-badge">PYQ</span>' : ''}
    <div class="q-timer-row" style="margin-left:auto">
      ${prevTimeStr ? `<span class="last-time" id="lt-${q.id}">${prevTimeStr}</span>` : `<span class="last-time" id="lt-${q.id}"></span>`}
      <div class="q-timer" id="timer-${q.id}" onclick="toggleTimer(${q.id})">▶ 0:00</div>
    </div>
  </div>
  <div class="q-body">
    <div class="q-text">${q.text}</div>
    ${buildOptions(q)}
  </div>
  <div class="explanation" id="exp-${q.id}">${q.explanation || ''}</div>
  <div class="q-actions" id="actions-${q.id}">
    <button class="btn btn-submit" id="sub-${q.id}" onclick="submit(${q.id})">Submit</button>
    <button class="btn btn-clear" onclick="clearAnswer(${q.id})">Clear</button>
    <button class="btn btn-explain" id="expbtn-${q.id}" onclick="toggleExplanation(${q.id})" style="display:none">Show Explanation</button>
    <span class="result-msg" id="res-${q.id}"></span>
    <span class="marks-delta" id="delta-${q.id}"></span>
  </div>`;
  return card;
}

function buildOptions(q) {
  if (q.type === 'nat') {
    return `<div class="nat-input-wrap">
      <input type="number" step="any" class="nat-input" id="nat-${q.id}" placeholder="Enter numerical answer" onchange="onNatChange(${q.id})">
      <span class="nat-hint">Type your answer — no negative marking</span>
    </div>`;
  }
  const inputType = q.type === 'msq' ? 'checkbox' : 'radio';
  const markerShape = q.type === 'msq' ? 'style="border-radius:4px"' : '';
  return `<div class="options" id="opts-${q.id}">` +
    q.opts.map((opt, i) => `
    <label class="opt-label" id="optlabel-${q.id}-${i}" onclick="onOptClick(${q.id},${i})">
      <input type="${inputType}" name="q${q.id}" value="${i}" id="opt-${q.id}-${i}">
      <span class="opt-marker" ${markerShape}>${String.fromCharCode(65+i)}</span>
      <span>${opt}</span>
    </label>`).join('') + '</div>';
}

// ============================================================
// TIMER
// ============================================================
function toggleTimer(qid) {
  if (!STATE.timers[qid]) STATE.timers[qid] = {elapsed: 0, interval: null, running: false};
  const t = STATE.timers[qid];
  const el = document.getElementById(`timer-${qid}`);
  if (t.running) {
    clearInterval(t.interval); t.interval = null; t.running = false;
    el.textContent = `▶ ${fmtTime(t.elapsed)}`; el.className = 'q-timer paused';
  } else {
    t.running = true; el.className = 'q-timer running';
    const start = Date.now() - t.elapsed * 1000;
    t.interval = setInterval(() => {
      t.elapsed = Math.floor((Date.now() - start) / 1000);
      el.textContent = `⏸ ${fmtTime(t.elapsed)}`;
    }, 500);
  }
}

function stopTimer(qid) {
  if (!STATE.timers[qid]) return;
  const t = STATE.timers[qid];
  if (t.running) { clearInterval(t.interval); t.interval = null; t.running = false; }
  STATE.timeLogs[qid] = t.elapsed;
  saveTimeLogs();
  const ltEl = document.getElementById(`lt-${qid}`);
  if (ltEl) ltEl.textContent = `Last: ${fmtTime(t.elapsed)}`;
  const timerEl = document.getElementById(`timer-${qid}`);
  if (timerEl) { timerEl.textContent = `✓ ${fmtTime(t.elapsed)}`; timerEl.className = 'q-timer paused'; }
}

function fmtTime(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

// ============================================================
// INTERACTIONS
// ============================================================
function onOptClick(qid, idx) {
  const q = QUESTIONS.find(q => q.id === qid);
  if (STATE.answers[qid]) return;
  if (!STATE.timers[qid] || !STATE.timers[qid].running) toggleTimer(qid);
  const lbl = document.getElementById(`optlabel-${qid}-${idx}`);
  if (q.type === 'mcq') {
    document.querySelectorAll(`#opts-${qid} .opt-label`).forEach(l => l.classList.remove('selected'));
    lbl.classList.add('selected');
  } else {
    lbl.classList.toggle('selected');
  }
  document.getElementById(`sub-${qid}`).disabled = false;
}

function onNatChange(qid) {
  if (!STATE.timers[qid] || !STATE.timers[qid].running) toggleTimer(qid);
  document.getElementById(`sub-${qid}`).disabled = false;
}

function clearAnswer(qid) {
  if (STATE.answers[qid]) return;
  document.querySelectorAll(`#opts-${qid} .opt-label`).forEach(l => l.classList.remove('selected'));
  const natEl = document.getElementById(`nat-${qid}`);
  if (natEl) natEl.value = '';
  document.getElementById(`sub-${qid}`).disabled = true;
}

// ============================================================
// SUBMIT
// ============================================================
function submit(qid) {
  const q = QUESTIONS.find(q => q.id === qid);
  if (STATE.answers[qid]) return;
  stopTimer(qid);

  let result, delta;
  if (q.type === 'nat') {
    const val = parseFloat(document.getElementById(`nat-${qid}`).value);
    if (isNaN(val)) { alert('Please enter a numerical value.'); return; }
    const correct = Math.abs(val - q.correct_val) <= (q.tolerance || 0);
    result = correct ? 'correct' : 'wrong';
    delta = correct ? q.marks : 0;
  } else if (q.type === 'mcq') {
    const selected = [...document.querySelectorAll(`#opts-${qid} .opt-label.selected`)].map(l => parseInt(l.id.split('-')[2]));
    if (!selected.length) { alert('Please select an option.'); return; }
    const correct = selected.length === 1 && selected[0] === q.correct[0];
    result = correct ? 'correct' : 'wrong';
    delta = correct ? q.marks : -(q.marks === 1 ? 0.33 : 0.67);
  } else { // msq
    const selected = [...document.querySelectorAll(`#opts-${qid} .opt-label.selected`)].map(l => parseInt(l.id.split('-')[2])).sort();
    const correct_sorted = [...q.correct].sort();
    const correct = JSON.stringify(selected) === JSON.stringify(correct_sorted);
    result = correct ? 'correct' : (selected.length ? 'wrong' : 'wrong');
    delta = correct ? q.marks : 0;
  }

  STATE.answers[qid] = {result, delta};
  STATE.attempted++;
  if (result === 'correct') { STATE.correct++; STATE.gained += delta; }
  else if (delta < 0) { STATE.wrong++; STATE.lost += Math.abs(delta); }
  else { STATE.wrong++; }
  STATE.score = STATE.gained - STATE.lost;

  // Style card
  const card = document.getElementById(`card-${qid}`);
  card.dataset.answered = 'true';
  card.classList.add(result === 'correct' ? 'answered-correct' : 'answered-wrong');

  // Show correct/wrong on options
  if (q.type !== 'nat') {
    q.correct.forEach(ci => {
      document.getElementById(`optlabel-${qid}-${ci}`).classList.add('correct-ans');
    });
    if (q.type === 'mcq') {
      const selected = [...document.querySelectorAll(`#opts-${qid} .opt-label.selected`)];
      selected.forEach(l => {
        if (!l.classList.contains('correct-ans')) l.classList.add('wrong-ans');
      });
    } else {
      document.querySelectorAll(`#opts-${qid} .opt-label.selected`).forEach(l => {
        if (!q.correct.includes(parseInt(l.id.split('-')[2]))) l.classList.add('wrong-ans');
      });
    }
  }

  // Result message
  const msg = document.getElementById(`res-${qid}`);
  const dEl = document.getElementById(`delta-${qid}`);
  msg.className = `result-msg ${result}`;
  msg.textContent = result === 'correct' ? '✓ Correct!' : '✗ Wrong';
  dEl.textContent = delta >= 0 ? `+${delta}` : `${delta.toFixed(2)}`;

  // Show explanation button
  document.getElementById(`expbtn-${qid}`).style.display = 'inline-block';
  document.getElementById(`sub-${qid}`).disabled = true;

  updateScoreBoard();
  updateProgress();
}

function toggleExplanation(qid) {
  const el = document.getElementById(`exp-${qid}`);
  const btn = document.getElementById(`expbtn-${qid}`);
  if (el.classList.contains('visible')) {
    el.classList.remove('visible'); btn.textContent = 'Show Explanation';
  } else {
    el.classList.add('visible'); btn.textContent = 'Hide Explanation';
  }
}

// ============================================================
// SCOREBOARD + PROGRESS
// ============================================================
function updateScoreBoard() {
  document.getElementById('sc-attempted').textContent = STATE.attempted;
  document.getElementById('sc-correct').textContent = STATE.correct;
  document.getElementById('sc-wrong').textContent = STATE.wrong;
  document.getElementById('sc-score').textContent = STATE.score.toFixed(2);
}

function updateProgress() {
  const total = QUESTIONS.length;
  const done = Object.keys(STATE.answers).length;
  document.getElementById('prog-label').textContent = `${done} / ${total}`;
  document.getElementById('prog-fill').style.width = `${(done/total)*100}%`;
}

// ============================================================
// FILTER
// ============================================================
function filterQ(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.q-card').forEach(card => {
    let show = false;
    if (type === 'all') show = true;
    else if (type === 'prop') show = card.dataset.topic === 'prop';
    else if (type === 'fol') show = card.dataset.topic === 'fol';
    else if (type === 'mcq') show = card.dataset.type === 'mcq';
    else if (type === 'msq') show = card.dataset.type === 'msq';
    else if (type === 'nat') show = card.dataset.type === 'nat';
    else if (type === 'pyq') show = card.dataset.pyq === 'true';
    else if (type === 'unattempted') show = card.dataset.answered === 'false';
    card.classList.toggle('hidden', !show);
  });
}

// ============================================================
// RESULTS MODAL
// ============================================================
function showResults() {
  const totalTime = Object.values(STATE.timers).reduce((s,t) => s + (t.elapsed||0), 0);
  const acc = STATE.attempted ? Math.round((STATE.correct / STATE.attempted) * 100) : 0;
  document.getElementById('modal-score').textContent = STATE.score.toFixed(2);
  document.getElementById('m-att').textContent = STATE.attempted;
  document.getElementById('m-unatt').textContent = QUESTIONS.length - STATE.attempted;
  document.getElementById('m-cor').textContent = STATE.correct;
  document.getElementById('m-wr').textContent = STATE.wrong;
  document.getElementById('m-gain').textContent = '+' + STATE.gained.toFixed(2);
  document.getElementById('m-lost').textContent = '-' + STATE.lost.toFixed(2);
  document.getElementById('m-time').textContent = fmtTime(totalTime);
  document.getElementById('m-acc').textContent = acc + '%';
  document.getElementById('results-overlay').classList.add('open');
}

function resetAll() {
  if (!confirm('Reset all answers and scores?')) return;
  location.reload();
}

// ============================================================
// INIT
// ============================================================
renderAll();
updateProgress();
</script>
